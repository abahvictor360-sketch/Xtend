# Nginx site for Xtend on a VPS (deploy/README.md). setup-server.sh copies
# this to /etc/nginx/sites-available/xtend with __DOMAIN__ replaced, then
# certbot adds HTTPS and the redirect from http.

upstream xtend_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

# No per-address rate limit: Nigerian mobile networks put many phones
# behind one shared address, and a limit would block whole areas at 08:00.

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # Selfies, shelf photos, invoices and count sheets are uploaded here.
  client_max_body_size 25m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Built files carry a hash in their name, so they never change.
  location /_next/static/ {
    proxy_pass http://xtend_app;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location /api/ {
    proxy_pass http://xtend_app;
    include /etc/nginx/snippets/xtend-proxy.conf;
    # Reports and Ask Xtend can take a while.
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://xtend_app;
    include /etc/nginx/snippets/xtend-proxy.conf;
  }
}
