# Say as little as possible about what runs Xtend (copied to
# /etc/nginx/conf.d/, so it covers the HTTPS site certbot writes too).
# No Nginx version, and none of the app's informational headers. The
# x-nextjs-* headers the browser's page router reads (prerender,
# stale-time, rewritten-path, postponed) stay, or moving between pages
# would break.
server_tokens off;
proxy_hide_header X-Powered-By;
proxy_hide_header X-Nextjs-Cache;
proxy_hide_header X-Nextjs-Matched-Path;
