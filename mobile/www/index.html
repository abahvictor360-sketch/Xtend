<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Xtend</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #f9f6f3; color: #2b211c; font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; }
      main { padding: 24px; max-width: 320px; }
      .mark { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 16px;
              background: linear-gradient(150deg, #d1511a, #9b3617); }
      button { margin-top: 16px; border: 0; border-radius: 14px; padding: 12px 20px; font: inherit;
               font-weight: 700; color: #fff; background: #d1511a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1 style="font-size:20px;margin:0 0 8px">Xtend</h1>
      <p style="margin:0;color:#7a6c64">No connection right now. Check your data or Wi-Fi, then try again.</p>
      <button onclick="location.href = window.XTEND_HOME || '/'">Try again</button>
    </main>
  </body>
</html>
