<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Xtend</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #0e1a14; color: #e1f5ee;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
      }
      .mark { font-size: 32px; font-weight: 800; letter-spacing: 0.02em; color: #5dcaa5; }
      .msg { font-size: 14px; opacity: 0.75; max-width: 20rem; line-height: 1.5; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #1d9e75; animation: pulse 1s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <!-- Shown only for the moment before the live Xtend site loads from
         server.url. If it stays on screen, the phone has no connection. -->
    <div class="wrap">
      <div class="mark">Xtend</div>
      <div class="dot"></div>
      <div class="msg" id="msg">Starting Xtend…</div>
    </div>
    <script>
      setTimeout(function () {
        var m = document.getElementById('msg')
        if (m) m.textContent = 'Still connecting. Check your internet and keep this open.'
      }, 6000)
    </script>
  </body>
</html>
